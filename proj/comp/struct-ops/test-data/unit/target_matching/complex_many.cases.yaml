# More multi-line targeting edge cases

- name: constructor_in_class
  content: |2
    class Thing {
      constructor(x) {
        this.x = x;
      }
    }
  target: |
    Thing
    constructor
  expected: |
    constructor(x) {
      this.x = x;
    }

- name: getter_setter
  content: |2
    class User {
      get name() { return this._name; }
      set name(val) { this._name = val; }
    }
  target: |
    User
    get name()
  expected: "get name() { return this._name; }"

- name: try_catch_finally
  content: |2
    function risky() {
      try {
        doThing();
      } catch (e) {
        log(e);
      } finally {
        cleanup();
      }
    }
  target: |
    risky
    try
  expected: |
    try {
      doThing();
    } catch (e) {
      log(e);
    } finally {
      cleanup();
    }

- name: catch_block_alone
  content: |2
