# TEST: Multiple matches returned for read_structure
- name: duplicate_function_names
  content: |2
    function process() { return 1; }
    function process() { return 2; }
  variations_valid:
    - "process"
  returned_contents:
    - "function process() { return 1; }"
    - "function process() { return 2; }"

# TEST: Methods in different classes
- name: method_in_different_classes
  content: |2
    class A {
      validate() { return true; }
    }
    class B {
      validate() { return false; }
    }
  variations_valid:
    - "validate"
    - "va  lid   ate"
  variations_invalid:
    - "valid"  # Partial
  returned_contents:
    - "validate() { return true; }"
    - "validate() { return false; }"
    
# TEST: Decorators and JSDoc included in boundaries
- name: typescript_decorator_inclusion
  content: |2
    // This comment is NOT part of the class
    
    /** This JSDoc IS part of the class */
    @Injectable()
    @Singleton
    export class ServiceWithDecorators {
      method() {}
    }
  variations_valid:
    - "ServiceWithDecorators"
    - "export class ServiceWithDecorators"
  variations_invalid:
    - "@Injectable"  # Decorator alone
    - "/** This JSDoc"  # Comment alone
  returned_contents: |
    /** This JSDoc IS part of the class */
    @Injectable()
    @Singleton
    export class ServiceWithDecorators {
      method() {}
    }

# TEST: Python decorators stacked
- name: python_decorator_stacking]
  content: |2
    # Regular comment not included
    
    @route('/api')
    @authenticate
    @cache(ttl=300)
    def api_endpoint():
        """Docstring IS included"""
        return {'status': 'ok'}
  variations_valid:
    - "api_endpoint"
    - "def api_endpoint():"
  variations_invalid:
    - "@route"  # Decorator alone
  returned_contents: |
    @route('/api')
    @authenticate
    @cache(ttl=300)
    def api_endpoint():
        """Docstring IS included"""
        return {'status': 'ok'}