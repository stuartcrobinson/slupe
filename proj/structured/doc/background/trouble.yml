- name: elif_as_child
  content: |2
    if (x > 0) {
      doA();
    } elif (x < 0) {
      doB();
    }
  target: |
    if (x > 0)
    elif (x < 0)
  error: "TARGET_NOT_FOUND"  # elif not child of if in AST

