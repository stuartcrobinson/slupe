- name: assertion_signature_method
  content: |2
    class Validator {
      static assert(condition: any): asserts condition is true {
        if (!condition) throw new Error();
      }
    }
  target: |
    Validator
    static assert(condition: any): asserts condition is true
    if (!condition)
  expected: "if (!condition) throw new Error();"

