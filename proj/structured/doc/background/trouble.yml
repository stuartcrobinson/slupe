- name: full_header_for_parent
  content: |2
    class Handler {
      async process(data: string): Promise<void> {
        if (!data) return;
      }
    }
  target: |
    Handler
    async process(data: string): Promise<void>
    if (!data)
  expected: "if (!data) return;"

